# Apache virtual host of the phpMyFAQ production image.
#
# TLS is expected to be terminated by a reverse proxy (Traefik, Caddy, nginx,
# a cloud load balancer). URL rewriting for the Symfony router lives in the
# shipped .htaccess, which is why AllowOverride All is required.

ServerTokens Prod
ServerSignature Off
ServerName localhost

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Server-side internals (configuration with database credentials, logs,
    # tracking data, compiled caches) and raw attachments must never be
    # served, even if the .htaccess rules were removed. Attachments are delivered through
    # the permission-checked /attachment/{id} controller.
    <DirectoryMatch "^/var/www/html/content/core/">
        Require all denied
    </DirectoryMatch>
    <DirectoryMatch "^/var/www/html/cache/">
        Require all denied
    </DirectoryMatch>
    <DirectoryMatch "^/var/www/html/content/user/attachments/">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
