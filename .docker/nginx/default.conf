# nginx reference configuration for phpMyFAQ (development stack, see docker-compose.yml)
#
# Only the front controllers are passed to PHP-FPM; every other .php file and
# all server-side directories (configuration, logs, caches, attachments, the
# updater's working directory) are refused before they can reach PHP.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost;

    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/html;

    # Increase max upload size (adjust as needed)
    client_max_body_size 100M;

    rewrite //  /           break;
    rewrite ^/$ /index.php  last;

    # Gzip Settings
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_proxied no-cache no-store private expired auth;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_buffers 16 8k;
    gzip_disable "MSIE [1-6]\.(?!.*SV1)";

    # --- Denied paths -------------------------------------------------------
    # Server-side internals under content/core/ (configuration with DB
    # credentials, tracking logs with sensitive query strings, logs, caches).
    location ^~ /content/core/ {
        deny all;
        return 403;
    }

    # The updater's working directory: downloaded packages, extracted code and
    # full-installation backups including the configuration.
    location ^~ /content/upgrades/ {
        deny all;
        return 403;
    }

    # Raw attachments: downloads must go through the permission-checked
    # /attachment/{id} controller.
    location ^~ /content/user/attachments/ {
        deny all;
        return 403;
    }

    # Compiled routes, container, Twig templates
    location ^~ /cache/ {
        deny all;
        return 403;
    }

    # Block zip files in content directory
    location ~ ^/content/.*\.zip$ {
        deny all;
        return 403;
    }

    # Dot files (.env, .git, .htaccess); /.well-known/ stays reachable for the
    # OAuth discovery document and ACME challenges.
    location ~ /\.(?!well-known/) {
        deny all;
        return 403;
    }

    # Composer and package manifests
    location ~ ^/(composer\.(json|lock)|package\.json|pnpm-lock\.yaml)$ {
        deny all;
        return 403;
    }

    # User-uploaded SVG files may contain scripts: sandbox them when opened
    # directly so they never run in the site origin, and forbid MIME sniffing.
    location ~* ^/content/user/images/.*\.svgz?$ {
        add_header Content-Security-Policy "sandbox";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options SAMEORIGIN;
        expires 1y;
        add_header Cache-Control "public";
    }

    # --- Static assets ------------------------------------------------------
    # Service Worker - must be before other .js rules, no caching, proper headers
    location ^~ /sw.js {
        default_type application/javascript;
        add_header Service-Worker-Allowed "/";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
    }

    location ~* \.(jpg|jpeg|gif|png|webp|svg|ico|mp4|webm|mpeg|ttf|otf|woff|woff2|css|js|pdf)$ {
        expires 1y;
        add_header Cache-Control "public";
    }

    # Additional configurations for specific file types
    location ~* \.(svg|eot|ttf|woff|woff2)$ {
        add_header Access-Control-Allow-Origin "*";
    }

    # Specific cache-control for javascript files
    location ~* \.(js)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Specific cache-control for CSS files
    location ~* \.(css)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Rewrite logging, should be turned off on production
    rewrite_log on;

    # X-Frame-Options to prevent clickjacking
    add_header X-Frame-Options SAMEORIGIN;

    # Error pages are handled by Symfony's front controller (PageNotFoundController).
    # Unknown URIs fall through `try_files` into `@rewriteapp` → /index.php, where
    # Symfony renders the styled 404 page. Do not intercept upstream PHP errors.
    fastcgi_intercept_errors off;

    # Update pages - rewrite before try_files can hit the PHP handler
    location ^~ /update {
        rewrite ^                                                    /index.php last;
    }

    location / {
        index index.php;
        try_files $uri $uri/ @rewriteapp;
    }

    location @rewriteapp {

        # Administration API
        rewrite ^/admin/api/                                         /admin/api/index.php last;

        # Administration pages (redirect /admin to /admin/)
        rewrite ^/admin$                                             /admin/ permanent;
        rewrite ^/admin/                                             /admin/index.php last;

        # API routes (all API endpoints)
        rewrite ^/api/                                               /api/index.php last;

        # Setup pages
        rewrite ^/setup/                                             /setup/index.php last;

        # Update page - route directly to index.php (handled by Symfony router)
        rewrite ^/update$                                            /index.php last;
        rewrite ^/update/                                            /index.php last;

        # Front controller: route all other requests to index.php (Symfony Router)
        rewrite ^                                                    /index.php last;
    }

    location /admin/assets {
        try_files $uri $uri/ =404;
    }

    # --- PHP ----------------------------------------------------------------
    # Only the front controllers are executed ...
    location ~ ^/(index|admin/index|api/index|admin/api/index|setup/index)\.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        resolver 127.0.0.11 valid=30s;
        set $upstream php-fpm:9000;
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # ... every other PHP file (uploaded or extracted) is refused.
    location ~ \.php$ {
        deny all;
        return 403;
    }
}

server {
