name: "phpMyFAQ Code Coverage → GitHub Pages"

on:
  push:
    branches: [main]
  # Optional: Manuelles Triggern über die GitHub UI
  workflow_dispatch:

# Sicherstellen, dass immer nur ein Deployment gleichzeitig läuft
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  coverage:
    name: Generate Coverage & Deploy
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.5'
          extensions: mbstring, xml, dom, gd, curl, zip, sqlite3, bcmath
          coverage: pcov

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests with coverage
        run: |
          php -dxdebug.mode=coverage phpmyfaq/src/libs/bin/phpunit \
            --coverage-html build/coverage \
            --coverage-clover build/coverage/clover.xml

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      # A re-run of a failed job keeps the artifact of the previous attempt in the
      # same workflow run, and deploy-pages refuses to pick between two artifacts
      # with the same name. A per-attempt name keeps every attempt unambiguous.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: build/coverage

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      # Runs after the deployment so the page URL of the published report is available.
      - name: Coverage Summary
        if: always()
        run: |
          if [ -f build/coverage/clover.xml ]; then
            echo "## Code Coverage Report" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            # Gesamtabdeckung aus clover.xml extrahieren
            COVERED=$(grep -oP 'coveredstatements="\K[0-9]+' build/coverage/clover.xml | tail -1)
            TOTAL=$(grep -oP 'statements="\K[0-9]+' build/coverage/clover.xml | tail -1)

            if [ -n "$COVERED" ] && [ -n "$TOTAL" ] && [ "$TOTAL" -gt 0 ]; then
              PERCENT=$(awk "BEGIN { printf \"%.1f\", ($COVERED/$TOTAL)*100 }")
              echo "**Gesamtabdeckung: ${PERCENT}%** (${COVERED}/${TOTAL} Statements)" >> "$GITHUB_STEP_SUMMARY"
            fi

            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "📊 [Vollständiger Report](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"
          fi
