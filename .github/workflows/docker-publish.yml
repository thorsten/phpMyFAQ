# Builds the production Docker images (.docker/production/Dockerfile) and
# publishes them to the GitHub Container Registry (ghcr.io/thorsten/phpmyfaq).
#
# - Pull requests and pushes to main that touch the image build only build
#   the amd64 image and run the smoke test; nothing is pushed.
# - A published GitHub release builds amd64 + arm64 and pushes them, tagged
#   with the release version (4.2.1, 4.2, 4, latest; pre-releases only get
#   their exact version). The FrankenPHP variant carries the "-frankenphp"
#   suffix.
# - workflow_dispatch builds on demand; "push" additionally publishes
#   ("edge" tag when run from a branch).
# - After the "phpMyFAQ Nightly Development Build" workflow has published its
#   nightly release, the same commit is built and pushed, tagged "nightly"
#   and "nightly-YYYY-MM-DD".
#
# Publishing needs no secrets: GHCR accepts the workflow token. The package is
# created private on the first push and must be made public once in the
# repository's package settings.
name: "Docker Image"

on:
  release:
    types: [published]
  pull_request:
    paths:
      - '.docker/production/**'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yml'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'bin/console'
  push:
    branches: [ main ]
    paths:
      - '.docker/production/**'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
    inputs:
      push:
        description: 'Publish the images to GHCR'
        type: boolean
        default: false
  workflow_run:
    workflows: ["phpMyFAQ Nightly Development Build"]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.variant }}
    # A nightly is only built when the nightly workflow succeeded; every other
    # trigger always runs.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: apache
            suffix: ''
          - variant: frankenphp
            suffix: '-frankenphp'
    env:
      PUBLISH: ${{ github.event_name == 'release' || github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.push) }}
      SMOKE_IMAGE: phpmyfaq-smoke:${{ matrix.variant }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # For a nightly, build exactly the commit the nightly release was made from
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up QEMU for the arm64 build
        if: env.PUBLISH == 'true'
        uses: docker/setup-qemu-action@v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to the GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect image tags and labels
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' }}
            type=raw,value=nightly,enable=${{ github.event_name == 'workflow_run' }}
            type=raw,value=nightly-{{date 'YYYY-MM-DD'}},enable=${{ github.event_name == 'workflow_run' }}
          labels: |
            org.opencontainers.image.title=phpMyFAQ
            org.opencontainers.image.vendor=phpMyFAQ Team
            org.opencontainers.image.licenses=MPL-2.0

      - name: Build the amd64 image for the smoke test
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: .docker/production/Dockerfile
          target: ${{ matrix.variant }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.SMOKE_IMAGE }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Smoke test (headless install, health check, access rules)
        run: .docker/production/smoke-test.sh "$SMOKE_IMAGE" 8089

      - name: Build and publish the multi-platform image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: .docker/production/Dockerfile
          target: ${{ matrix.variant }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Published tags
        if: env.PUBLISH == 'true'
        run: |
          {
            echo "### ${{ matrix.variant }} image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
