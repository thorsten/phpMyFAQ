site_name: phpMyFAQ v4.2
theme:
  name: readthedocs
  highlightjs: true
not_in_nav: |
  /s3-storage-checklist.md
  /keys/**
extra_css:
  - css/custom.css
hooks:
  - docs/hooks.py
plugins:
  - search
  - mermaid2
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
nav:
  - 1. Introduction: 'index.md'
  - 2. Installation: 'installation.md'
  - 3. Production Deployment: 'deployment.md'
  - 4. Docker Cheat Sheet: 'docker-cheatsheet.md'
  - 5. Updating phpMyFAQ: 'update.md'
  - 6. Use phpMyFAQ: 'usage.md'
  - 7. Manage phpMyFAQ: 'administration.md'
  - 8. Configuration reference: 'configuration.md'
  - 9. Keycloak Integration: 'keycloak.md'
  - 10. OpenID Connect Integration: 'openid-connect.md'
  - 11. AI-Assisted Translation feature: 'ai-translation.md'
  - 12. Developer documentation: 'development.md'
  - 13. Architecture: 'architecture.md'
  - 14. Plugins: 'plugins.md'
  - 15. MCP Server: 'mcp-server.md'
  - 16. Release: 'release.md'
  - 17. Security Processs: 'security-process.md'
  - 18. Thank you!: 'thank-you.md'
